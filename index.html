<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영지 RPG">
<meta name="description" content="로그인 없이 바로 시작하는 방치형 RPG + 전국 부동산 통합 게임">
<title>⚔️ 영지 RPG · 부동산 통합</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<!-- 오류 수집(검증·현장 진단용): window.__errs 에 로드/실행 오류를 모은다. 화면·동작에는 영향 없음 -->
<script>window.__errs=[];(function(){function push(v){try{window.__errs.push(String(v));if(window.__errs.length>40)window.__errs.shift();}catch(e){}}addEventListener("error",function(e){try{if(e.target&&e.target.tagName&&e.target.tagName!=="WINDOW"){push("res:"+(e.target.tagName+" "+(e.target.src||e.target.href||"")));}else{push("err:"+(e.message||String(e.error)));}}catch(x){}},true);addEventListener("unhandledrejection",function(e){push("reject:"+String((e.reason&&e.reason.message)||e.reason));});})();</script>
<!-- 부팅 안전망(v7.9.1): app.js 가 실행되지 못해 스플래시에 갇혀도 서비스워커를 새로 받아 한 번 새로고침한다.
     index.html 은 항상 네트워크 우선으로 받으므로, 구버전 캐시에 갇힌 사용자도 이 코드로 빠져나온다. -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  var KEY = 'land_rpg_boot_reload';
  var hadController = !!navigator.serviceWorker.controller;
  function once() {
    try { if (sessionStorage.getItem(KEY) === '1') return false; sessionStorage.setItem(KEY, '1'); return true; } catch (e) { return false; }
  }
  function reload() { setTimeout(function () { location.reload(); }, 350); }

  // 이미 제어 중이다 = 업데이트 상황 → 새 워커가 잡으면 한 번 새로고침(첫 설치 때는 app.js 가 처리)
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) return;
    if (!once()) return;
    reload();
  });

  // 스플래시에 갇혔는지 8초 뒤 확인 — 갇혔다면 캐시 갱신을 강제하고 한 번만 새로고침
  setTimeout(function () {
    var boot = document.getElementById('boot');
    if (!boot || boot.classList.contains('out')) return;
    if (!navigator.serviceWorker.controller && !hadController) return; // 워커가 없으면 새로고침으로 달라지지 않는다
    if (!once()) return;
    try {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (!reg) { reload(); return; }
        (reg.update ? reg.update() : Promise.resolve()).catch(function () {}).then(function () {
          if (reg.waiting) { try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {} }
          setTimeout(reload, 1200);
        });
      }).catch(reload);
    } catch (e) { reload(); }
  }, 8000);
})();
</script>
</head>
<body>

<div id="app" class="app">

  <!-- 상단 상태줄: 내 부동산 요약 + 재화 -->
  <header class="hud" id="hud">
    <div class="hud-l">
      <button class="badge" id="assetBadge" type="button" aria-label="내 부동산 열기">
        <span class="ico">🏢</span>
        <b id="assetVal">0</b><span class="u">평</span>
        <i class="dot"></i>
        <span class="rent" id="rentHr">+0/h</span>
      </button>
      <button class="install-btn hidden" id="installBtn" type="button" data-action="install" aria-label="홈 화면에 앱으로 설치">📲 <b>설치</b></button>
    </div>
    <div class="hud-r">
      <button class="snd-btn" id="soundBtn" type="button" aria-label="효과음 끄기"><span id="soundIco">🔊</span></button>
      <span class="res"><span class="ico">💰</span><b id="goldVal">0</b></span>
      <span class="res"><span class="ico">💎</span><b id="shardVal">0</b></span>
    </div>
  </header>

  <!-- 상단 40%: 자동사냥 캔버스 -->
  <section class="stage" id="stage">
    <canvas id="battle" aria-label="자동 사냥 화면"></canvas>

    <div class="stage-top">
      <div class="stage-chip">
        <span class="s-label" id="stageNum">스테이지 1</span>
        <span class="s-theme" id="themeName">초원</span>
      </div>
      <div class="stage-top-r">
        <button class="todo-btn hidden" id="todoBtn" type="button" data-action="open-todo" aria-label="오늘의 할 일 허브">📋 <b id="todoCount">0</b></button>
        <button class="stage-spd hidden" id="stageSpeedBtn" type="button" data-action="cycle-speed" aria-label="전투 배속 전환">⚡×1</button>
        <button class="boss-btn" id="bossBtn" type="button">
          <span class="b-ico">👑</span>
          <span class="b-txt">보스</span>
          <span class="b-count" id="bossCount">3</span>
        </button>
      </div>
    </div>

    <div class="stage-buffs hidden" id="battleBuffBar" aria-live="off"></div>

    <div class="stage-bottom">
      <div class="killbar" id="killDots" aria-hidden="true"></div>
      <div class="bars">
        <div class="bar hp"><i id="hpFill"></i><span id="hpText">100 / 100</span></div>
        <div class="bar exp"><i id="expFill"></i><span id="expText">Lv.1 · 0%</span></div>
      </div>
    </div>

    <div class="quick" id="quickSkills">
      <button class="q" data-skill="strike" type="button" aria-label="강격 시전"><span class="q-ico">💥</span><i class="q-cd"></i></button>
      <button class="q" data-skill="whirl" type="button" aria-label="범위 베기 시전"><span class="q-ico">🌀</span><i class="q-cd"></i></button>
      <button class="q" data-skill="berserk" type="button" aria-label="광폭 시전"><span class="q-ico">🔥</span><i class="q-cd"></i></button>
      <button class="q" data-skill="heal" type="button" aria-label="회복 시전"><span class="q-ico">💚</span><i class="q-cd"></i></button>
      <!-- v4.7 상위 전직 궁극기 — 5단계부터 나타나는 다섯 번째 필살기(4개 슬롯 레이아웃은 그대로) -->
      <button class="q ult hidden" data-skill="ultimate" type="button" aria-label="궁극기 시전"><span class="q-ico">🐉</span><i class="q-cd"></i></button>
    </div>

    <div class="offline-pill hidden" id="offlinePill">방치 보상 계산 중…</div>
  </section>

  <!-- 하단 60%: 탭 UI -->
  <main class="panel" id="panel">
    <div class="panel-inner" id="panelInner"></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="hunt" type="button"><span>⚔️</span><b>사냥</b><i class="tab-dot hidden" id="huntTabDot" aria-hidden="true"></i></button>
    <button class="tab" data-tab="gear" type="button"><span>🎒</span><b>성장</b><i class="tab-dot hidden" id="gearTabDot" aria-hidden="true"></i></button>
    <button class="tab" data-tab="land" type="button"><span>🏢</span><b>부동산</b><i class="tab-dot hidden" id="landTabDot" aria-hidden="true"></i></button>
    <button class="tab" data-tab="settings" type="button"><span>⚙️</span><b>설정</b><i class="tab-dot hidden" id="settingsTabDot" aria-hidden="true"></i></button>
  </nav>
</div>

<div class="toast-root" id="toastRoot" aria-live="polite"></div>
<!-- v4.3: 캔버스 연출(보스 등장·부활)을 스크린리더에도 알린다 -->
<div class="sr-only" id="srLive" role="status" aria-live="assertive"></div>
<div class="modal-root hidden" id="modalRoot">
  <div class="modal-backdrop" data-modal-close></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<div class="boot" id="boot">
  <div class="boot-logo">⚔️</div>
  <div class="boot-title">영지 RPG</div>
  <div class="boot-sub">부동산 통합 · 게스트</div>
  <div class="boot-bar"><i></i></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
