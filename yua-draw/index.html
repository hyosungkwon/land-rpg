<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<title>🎨 그림 놀이 → 🌟 유아의 놀이터</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
       background:linear-gradient(160deg,#0f0c29,#302b63 55%,#24243e);color:#fff;
       display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:340px;width:100%}
  .em{font-size:56px;animation:float 2.6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:20px;margin:10px 0 6px;color:#FFD93D}
  p{font-size:14px;line-height:1.55;color:rgba(255,255,255,.78);margin:0 0 16px}
  a{display:inline-block;background:linear-gradient(135deg,#FFD93D,#FF9800);color:#5a3e00;
    text-decoration:none;font-weight:bold;border-radius:16px;padding:14px 22px;font-size:16px;
    box-shadow:0 6px 0 rgba(0,0,0,.2)}
  .small{margin-top:14px;font-size:12px;color:rgba(255,255,255,.45)}
</style>
<script>
  // 예전 yua-draw 주소로 들어온 안내를 통합 앱의 그림 놀이 화면으로 넘긴다.
  var TARGET = '../kids-app/?screen=ydraw';
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.filter(function (k) { return k.indexOf('yua-draw-') === 0; })
            .forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  } catch (e) {}
  setTimeout(function () { location.replace(TARGET); }, 700);
</script>
</head>
<body>
  <div class="card">
    <div class="em">🌈</div>
    <h1>그림 놀이가 새 집으로 이사했어요!</h1>
    <p>이제 <b>🌟 유아의 놀이터</b> 안에서<br>자유 그리기와 주제 일치율 놀이를 함께 즐겨요.</p>
    <a href="../kids-app/?screen=ydraw">🎨 유아의 놀이터 열기</a>
    <div class="small">잠시 뒤 자동으로 이동해요</div>
  </div>
</body>
</html>
