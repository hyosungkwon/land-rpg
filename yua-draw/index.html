<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dff1ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>유아의 그림 놀이 🎨</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-ico">🎨</span><span>유아의 그림 놀이</span></div>
    <div class="top-actions">
      <button id="btnSound" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      <button id="btnGallery" class="icon-btn" aria-label="내 그림 갤러리">🖼️</button>
    </div>
  </header>

  <section class="topic">
    <div class="topic-emoji" id="topicEmoji">🍎</div>
    <div class="topic-text">
      <div class="topic-label">오늘의 주제</div>
      <div class="topic-word" id="topicWord">사과</div>
    </div>
    <button id="btnNext" class="pill">다른 주제 ↻</button>
  </section>

  <section class="tools">
    <div class="palette" id="palette"></div>
    <div class="tool-row">
      <button class="tool" id="btnEraser">🧽 <span>지우개</span></button>
      <div class="sizes" id="sizes"></div>
      <button class="tool" id="btnUndo">↩︎ <span>되돌리기</span></button>
      <button class="tool" id="btnClear">🧹 <span>싹 지우기</span></button>
    </div>
  </section>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="hint" aria-hidden="true"></canvas>
    <canvas id="draw" aria-label="그림 그리는 곳"></canvas>
    <div class="empty-hint" id="emptyHint">손가락으로 그려 보세요 ✏️</div>
    <div class="hint-badge" id="hintBadge">점선을 따라 그려 보세요</div>
    <div class="toast" id="toast"></div>
  </div>

  <footer class="bottom">
    <button id="btnHint" class="ghost">👀 힌트 보기</button>
    <button id="btnSubmit" class="primary">다 그렸어요! 제출 ✨</button>
  </footer>
</div>

<!-- 결과 -->
<div class="modal" id="resultModal" hidden>
  <div class="modal-card result-card">
    <div class="result-top">
      <div class="result-topic" id="resTopic">🍎 사과</div>
      <button class="x" id="btnResultClose" aria-label="닫기">✕</button>
    </div>
    <div class="result-body">
      <img id="resThumb" class="res-thumb" alt="내가 그린 그림">
      <div class="result-score">
        <div class="score"><span id="scoreNum">92</span><span class="pct">%</span></div>
        <div class="score-label">일치율</div>
        <div class="stars" id="stars">⭐⭐⭐</div>
      </div>
    </div>
    <p class="praise" id="praiseText"></p>
    <p class="tip" id="tipText"></p>
    <div class="result-actions">
      <button id="btnSavePng" class="ghost">💾 그림 저장</button>
      <button id="btnNextTopic" class="primary">다음 주제 →</button>
    </div>
  </div>
</div>

<!-- 갤러리 -->
<div class="modal" id="galleryModal" hidden>
  <div class="modal-card gallery-card">
    <div class="result-top">
      <div class="result-topic">🖼️ 유아의 그림 갤러리</div>
      <button class="x" id="btnGalleryClose" aria-label="닫기">✕</button>
    </div>
    <p class="gallery-sub">최근 12개까지 모여요</p>
    <div class="gallery" id="galleryList"></div>
  </div>
</div>

<!-- 확인 -->
<div class="modal" id="confirmModal" hidden>
  <div class="modal-card confirm-card">
    <p class="confirm-text" id="confirmText">그림을 지우고 새 주제로 갈까요?</p>
    <div class="result-actions">
      <button id="btnConfirmNo" class="ghost">아니야</button>
      <button id="btnConfirmYes" class="primary">응, 좋아!</button>
    </div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script src="topics.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
