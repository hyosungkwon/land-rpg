<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌟 유아의 놀이터 — 모바일 미리보기 (390×844)</title>
<style>
  html,body{margin:0;height:100%;background:#1b1b2b;color:#cfd8e3;
    font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;}
  .cap{font-size:13px;color:#8b9bb4}
  .phone{width:410px;height:864px;border-radius:38px;padding:10px;background:#0b0b12;
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 0 0 2px #2a2a3d;}
  iframe{width:390px;height:844px;border:0;border-radius:30px;background:#0f0c29;display:block}
  a{color:#FFD93D}
</style>
</head>
<body>
  <div class="wrap">
    <div class="cap">📱 모바일 미리보기 · iframe 390×844</div>
    <div class="phone"><iframe id="frame" src="./index.html" title="유아의 놀이터 미리보기"></iframe></div>
    <div class="cap">실제 폰에서는 <a href="./index.html">이 링크</a>로 열어요 · 홈 화면에 추가하면 앱처럼 실행됩니다</div>
  </div>
<script>
  // 미리보기 주소의 ?v= 를 iframe 에도 넘겨, 배포 직후 예전 화면이 남지 않게 한다.
  (function () {
    var v = new URLSearchParams(location.search).get('v') || '0';
    document.getElementById('frame').src = './index.html?pv=' + encodeURIComponent(v);
  })();
</script>
</body>
</html>
