<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>land-rpg v3.7 · 몬스터 모션 미리보기</title>
<style>
  html, body { margin: 0; background: #05070c; color: #cfd6e4; font: 12px/1.5 system-ui, sans-serif; }
  .wrap { padding: 8px; }
  canvas { width: 390px; height: 300px; display: block; border-radius: 8px; overflow: hidden; background: #070a12; }
  .cap { padding: 6px 2px 0; font-size: 11px; color: #8b96aa; white-space: pre-line; }
</style>
</head>
<body>
<!-- 개발/검증용: 전투를 가상 시계로 돌려 특정 모션 순간에서 멈춰 그린다.
     ?scene=walk|slime|flyer|ranged|windup|melee|death|boss -->
<div class="wrap"><canvas id="cv"></canvas><div class="cap" id="cap">loading…</div></div>
<script type="module">
import { defaultState, calcStats } from '../src/state.js';
import { Battle } from '../src/combat.js';
import { Renderer } from '../src/render.js';
import { stageDef, monsterMotion, spriteSrc } from '../src/data.js';

const params = new URLSearchParams(location.search);
const scene = params.get('scene') || 'walk';
// 장면별 스테이지 — 보스가 나오는 장면은 그 보스의 공격 방식(근접/원거리)을 노린다
const SCENES = {
  walk:    { stage: 2,  boss: false },
  walker:  { stage: 2,  boss: false },
  slime:   { stage: 1,  boss: false },
  flyer:   { stage: 7,  boss: false },
  feather: { stage: 7,  boss: false, weak: true },
  dark:    { stage: 4,  boss: true, weak: true },   // 데스로드(보스·암흑 구체)
  melee:   { stage: 2,  boss: true, weak: true },   // 트롤(보스·내려찍기)
  bite:    { stage: 3,  boss: true, weak: true },   // 케르베로스(보스·물기)
  ranged:  { stage: 12, boss: true, weak: true },   // 레드드래곤(보스·화염구)
  windup:  { stage: 12, boss: true, weak: true },
  claw:    { stage: 6,  boss: false, weak: true },   // 웨어울프 할퀴기
  death:   { stage: 5,  boss: false },
  boss:    { stage: 12, boss: true, weak: true },
};
const cfg = SCENES[scene] || SCENES.walk;
const STAGE = cfg.stage;

const s = defaultState(0);
s.stage = STAGE;
s.maxStage = STAGE;
s.level = cfg.weak ? 1 : 40;
s.totalKills = scene === 'claw' ? 1 : 999; // claw 장면은 첫 스폰을 웨어울프로
s.killsInStage = 10;
s.bossReady = !!cfg.boss;
s.autoBoss = !!cfg.boss; // 보스 장면이 아니면 자동 보스가 끼어들지 않게
s.equip = cfg.weak
  ? { weapon: 0, armor: 0, helmet: 0, ring: 0, amulet: 0 }
  : { weapon: 24, armor: 14, helmet: 14, ring: 8, amulet: 8 };
s.gearRarity = cfg.weak
  ? { weapon: 'common', armor: 'common', helmet: 'common', ring: 'common', amulet: 'common' }
  : { weapon: 'hero', armor: 'rare', helmet: 'rare', ring: 'legend', amulet: 'hero' };

const rng = (() => { let x = 12345; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; })();
const b = new Battle(s, () => ({}), rng, 0);
const r = new Renderer(document.getElementById('cv'));
r.setBattle(b);
r.effects = true;

const d = stageDef(STAGE);
// 이 페이지는 tools/ 아래라 스프라이트 경로가 ../assets/... 이다
const load = (name) => new Promise((res) => {
  const img = new Image();
  img.onload = () => { r.images.set(name, img); res(); };
  img.onerror = () => { r.images.set(name, null); res(); };
  img.src = '../' + spriteSrc(name);
});
await Promise.all(['hero_idle', 'hero_attack', 'hero_skill', ...d.normals, d.boss, 'fx_claw', 'fx_burst'].map(load));
r.resize();

// 진단용 카운터(장면이 기대한 순간에 멈췄는지 확인)
let atkTotal = 0;
let projTotal = 0;
let maxK = 0;
let maxLen = 0;
const origOnEvents = r.onEvents.bind(r);
r.onEvents = (evs, now) => {
  for (const e of evs) if (e.t === 'monsterAttack') atkTotal++;
  return origOnEvents(evs, now);
};
const origSpawn = r.spawnProjectile.bind(r);
r.spawnProjectile = (ev, now) => {
  projTotal++;
  const res = origSpawn(ev, now);
  const p = r.projectiles[r.projectiles.length - 1];
  if (window.__dbg && projTotal <= 3) window.__dbg.push(['spawn', now, p && p.t0, p && p.dur, p && p.kind]);
  return res;
};

window.__dbg = [];
const cap = document.getElementById('cap');
const DT = 16;
let t = 0;
let frames = 0;

function step() {
  b.tick(DT, t);
  const evs = b.drainEvents();
  if (evs.length) r.onEvents(evs, t);
  r.frame(t);
  t += DT;
  frames++;
  maxLen = Math.max(maxLen, r.projectiles.length);
  for (const p of r.projectiles) {
    maxK = Math.max(maxK, (t - p.t0) / (p.dur || 1));
    if (window.__dbg && window.__dbg.length < 60) window.__dbg.push(['live', t, p.t0, p.dur, (t - p.t0) / p.dur]);
  }
}

const onlyBoss = () => b.monsters.filter((m) => !m.dead && !m.dying);
const striking = () => onlyBoss().some((m) => (m.lunge || 0) > 0.3 && (m.lunge || 0) < 0.95) && (r.arcs.length > 0 || r.fx.some((f) => f.key === 'slam'));
const boss = () => b.boss;

function stop() {
  // 멈춘 순간을 한 프레임 더 그려 상태를 확정한다
  r.frame(t);
  const ms = onlyBoss().map((m) => `${m.ko}(${monsterMotion(m.name)}${m.isBoss ? ',보스' : ''}) x=${Math.round(m.x)}`).join(' · ');
  const wind = onlyBoss().filter((m) => m.windupAt).map((m) => `${m.ko} 전조 ${Math.round(((t - m.windupAt) / (m.windupDur || 1)) * 100)}%`).join(' · ');
  cap.textContent = `${scene} · stage ${STAGE} · t=${(t / 1000).toFixed(2)}s · 공격 ${atkTotal}회 · 투사체 ${projTotal}개(최대 ${maxLen}개 동시, k=${maxK.toFixed(2)}, effects=${r.effects})\n${ms}${wind ? '\n' + wind : ''}`;
  window.__motionReady = true;
}

const preds = {
  walk: () => t > 1200,
  slime: () => onlyBoss().some((m) => monsterMotion(m.name) === 'slime' && m.x < 680 && (m.walk % 92) > 34 && (m.walk % 92) < 58),
  flyer: () => onlyBoss().some((m) => monsterMotion(m.name) === 'flyer' && m.moving && m.x < 680),
  walker: () => onlyBoss().some((m) => monsterMotion(m.name) === 'walker' && m.moving && m.x < 680),
  ranged: () => r.projectiles.some((p) => { const k = (t - p.t0) / p.dur; return k > 0.35 && k < 0.8; }),
  feather: () => r.projectiles.some((p) => { const k = (t - p.t0) / p.dur; return k > 0.3 && k < 0.85; }),
  dark: () => r.projectiles.some((p) => { const k = (t - p.t0) / p.dur; return k > 0.3 && k < 0.85; }),
  windup: () => { const m = boss(); return m && m.windupAt && (t - m.windupAt) / (m.windupDur || 1) > 0.72; },
  melee: () => striking(),
  bite: () => striking(),
  claw: () => striking(),
  death: () => b.monsters.some((m) => m.dying && t - m.dying > 130 && t - m.dying < 320),
  boss: () => r.bossRoar && t - r.bossRoar.t0 > 260 && t - r.bossRoar.t0 < 620,
};

const MAX_FRAMES = Math.round(45000 / DT);
while (frames < MAX_FRAMES) {
  step();
  if (preds[scene] && preds[scene]()) break;
}
stop();
</script>
</body>
</html>
