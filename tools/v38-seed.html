<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>land-rpg v3.8 테스트 세이브 시드</title>
<style>
  body { margin: 0; background: #070a12; color: #c9d4e6; font: 14px/1.6 system-ui, sans-serif; padding: 18px; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: 1px solid #2b3a55;
    background: #16233a; color: #dce6f7; font: 600 14px system-ui, sans-serif; }
  button:active { transform: scale(.99); }
  code { color: #7fd3ff; }
  .note { color: #7f8ba1; font-size: 12px; }
</style>
</head>
<body>
<!-- 개발/검증용: 다굴·신규 몬스터를 바로 확인할 수 있게 테스트 세이브를 심고 앱을 연다. -->
<h1>v3.8 테스트 세이브 시드</h1>
<p class="note">저장 키 <code>land_rpg_unified_v3</code> 에 상태를 넣고 앱을 엽니다. 실제 사용자 세이브는 이 기기에 없습니다(검증용 서버).</p>
<div id="list"></div>
<script>
  const KEY = 'land_rpg_unified_v3';
  const now = Date.now();

  function mk(opts) {
    const mkEquip = (n) => ({ weapon: n, armor: n, helmet: n, ring: n, amulet: n });
    const base = {
      ver: 3, guest: true, createdAt: now, lastActiveAt: now,
      level: opts.level, exp: 0, gold: opts.gold ?? 250000, shards: 4000,
      hp: null, equip: mkEquip(opts.equip ?? 0),
      gearRarity: { weapon: 'common', armor: 'common', helmet: 'common', ring: 'common', amulet: 'common' },
      gacha: { pity: 0, total: 0, best: 'common', legend: 0, cur: 'gold' },
      soundOn: false,
      skills: { strike: { lv: 0, last: 0 }, whirl: { lv: 0, last: 0 }, berserk: { lv: 0, last: 0 }, heal: { lv: 0, last: 0 } },
      stage: opts.stage, killsInStage: 0, bossReady: false, totalKills: 0, bossKills: 0,
      maxStage: opts.stage, autoBoss: true, effects: true,
      jobTier: opts.job ?? 0, jobAt: 0,
      pet: { equipped: null, unlocked: [], chosen: false },
      dungeonCooldown: 0, dungeon: { best: 0, runs: 0, last: null },
      quests: { idx: 0, claimed: [], done: 0, at: 0 }, achievements: { claimed: [] },
      codex: { monsters: {}, cities: {}, gear: {} },
      news: { seen: [], log: [], lastBlock: -1 },
      rebirth: { count: 0, points: 0, totalPoints: 0, traits: opts.traits || {}, bestStage: 1, at: 0 },
      peakStage: opts.stage,
      records: { totalGold: 0, totalRent: 0, playMs: 0, firstPlay: now },
      lastOffline: null,
    };
    return base;
  }

  const presets = [
    { label: 'S27 · Lv52 · 드래곤 나이트 (사용자 현재 추정)', opts: { stage: 27, level: 52, job: 3, equip: 46 } },
    { label: 'S20 · Lv40 · 성기사 (중반)', opts: { stage: 20, level: 40, job: 2, equip: 30 } },
    { label: 'S4 · Lv8 · 견습 (초반)', opts: { stage: 4, level: 8, job: 0, equip: 6 } },
    { label: 'S12 · 동굴 테마', opts: { stage: 12, level: 26, job: 1, equip: 20 } },
    { label: 'S31 · 무한 구간', opts: { stage: 31, level: 60, job: 3, equip: 70, traits: { guard: 8, hp: 6 } } },
  ];

  const list = document.getElementById('list');
  for (const p of presets) {
    const b = document.createElement('button');
    b.textContent = p.label;
    b.onclick = () => {
      localStorage.setItem(KEY, JSON.stringify(mk(p.opts)));
      location.href = '../index.html?tab=hunt';
    };
    list.appendChild(b);
  }
  const clear = document.createElement('button');
  clear.textContent = '세이브 지우고 새 게임';
  clear.onclick = () => { localStorage.removeItem(KEY); location.href = '../index.html?tab=hunt'; };
  list.appendChild(clear);
</script>
</body>
</html>
