<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>land-rpg v4.2 · 테스트 세이브 시드 (도전의 탑 · 펫 진화)</title>
<style>
  body { margin: 0; background: #070a12; color: #c9d4e6; font: 14px/1.6 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .note { color: #7f8ba1; font-size: 12px; margin-bottom: 12px; }
  a, button { display: block; padding: 10px 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #2b3a55;
    background: #16233a; color: #dce6f7; font: 600 13px system-ui, sans-serif; text-decoration: none; }
  code { color: #7fd3ff; }
  .warn { color: #ffb86b; font-size: 12px; }
</style>
</head>
<body>
<!-- 개발/검증용(v4.2): 도전의 탑·펫 진화 화면을 바로 확인하도록 테스트 세이브를 심고 390×844 미리보기를 연다.
     ?scene=tower|pet|floors 로 장면을 고른다. 기존 세이브는 __backup 키에 한 번 보관한다. -->
<h1>v4.2 테스트 세이브 시드</h1>
<p class="note">저장 키 <code>land_rpg_unified_v3</code> 에 상태를 넣고 <code>mobile-frame.html</code> 을 엽니다.
기존 값은 <code>land_rpg_unified_v3__backup_v42</code> 에 한 번 백업됩니다.</p>
<p class="warn">검증용 페이지입니다. 실제 플레이 세이브가 있는 기기에서는 누르지 마세요.</p>
<div id="list"></div>
<script type="module">
  import { defaultState } from '../src/state.js';

  const KEY = 'land_rpg_unified_v3';
  const BACKUP = KEY + '__backup_v42';

  function seed(opts) {
    const now = Date.now();
    const s = defaultState(now);
    const stage = opts.stage || 14;
    s.stage = stage;
    s.maxStage = stage;
    s.peakStage = stage;
    s.level = opts.level || 22;
    s.gold = opts.gold ?? 320000;
    s.shards = opts.shards ?? 1800;
    s.totalKills = stage * 14;
    s.bossKills = stage;
    s.soundOn = false;
    s.jobTier = 2;
    s.effects = true;
    const eq = 30;
    s.equip = { weapon: eq, armor: eq, helmet: eq, ring: eq, amulet: eq };
    s.gearRarity = { weapon: 'rare', armor: 'rare', helmet: 'rare', ring: 'legend', amulet: 'hero' };
    // 🐾 펫 — 해금 4종 + 진화 단계(늑대 신수 · 여우 각성 · 부엉이 신수 · 드래곤 기본)
    s.pet = {
      equipped: opts.pet || 'wolf',
      unlocked: ['wolf', 'fox', 'owl', 'dragon'],
      chosen: true,
      levels: { wolf: 10, fox: 7, owl: 10, dragon: 4 },
      evo: opts.evo || { wolf: 2, fox: 1, owl: 2 },
    };
    // 🗼 도전의 탑 — 4층까지 클리어, 5층 도전 가능
    s.tower = {
      cleared: opts.cleared || [1, 2, 3, 4],
      best: 4,
      runs: 9,
      fails: 2,
      last: { at: now - 600000, n: 5, how: 'timeout', kills: 7, bossKills: 0, dmg: 48211, gold: 0, shards: 0, points: 0 },
    };
    s.dungeon = { best: 0, runs: 0, last: null };
    s.rebirth = { count: 1, points: 12, totalPoints: 24, traits: { atk: 4, guard: 4, hp: 3, regen: 2 }, bestStage: 26, at: 0 };
    s.records.playMs = 7200 * 1000;
    // 부동산 — 건물주 버프/펫 카드가 살아 있게
    s.land.owned = {};
    s.land.sub = opts.sub || 'buff';
    s.land.rentAt = now;
    s.lastActiveAt = now; // 오프라인 팝업이 뜨지 않게
    return s;
  }

  const SCENES = {
    tower: { tab: 'hunt', sub: 'growth' },
    battle: { tab: 'hunt', sub: 'growth' },
    pet: { tab: 'land', sub: 'buff' },
    floors: { tab: 'hunt', sub: 'growth' },
  };

  function put(scene) {
    const opts = { sub: scene === 'pet' ? 'buff' : 'growth' };
    const s = seed(opts);
    if (scene === 'pet') {
      s.land.owned = { '11_0_0': 40, '11_1_0': 40, '2_0_0': 60, '3_0_0': 30 };
    }
    try {
      const cur = localStorage.getItem(KEY);
      if (cur && !localStorage.getItem(BACKUP)) localStorage.setItem(BACKUP, cur);
    } catch (e) { /* ignore */ }
    localStorage.setItem(KEY, JSON.stringify(s));
    const sc = SCENES[scene] || SCENES.tower;
    location.replace(`mobile-frame.html?tab=${sc.tab}&sub=${sc.sub}`);
  }

  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || '';
  if (SCENES[scene]) put(scene);

  const list = document.getElementById('list');
  const presets = [
    ['🗼 도전의 탑 (전직·환생 탭)', 'tower'],
    ['🐾 펫 진화 화면 (부동산 · 건물주 버프)', 'pet'],
    ['📋 층 선택 모달', 'floors'],
  ];
  for (const [label, key] of presets) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => put(key);
    list.appendChild(b);
  }
  const back = document.createElement('a');
  back.textContent = '↩️ 백업한 세이브로 복구';
  back.href = '#';
  back.onclick = (e) => {
    e.preventDefault();
    try {
      const v = localStorage.getItem(BACKUP);
      if (v) localStorage.setItem(KEY, v);
    } catch (err) { /* ignore */ }
    location.replace('mobile-frame.html?tab=hunt');
  };
  list.appendChild(back);
</script>
</body>
</html>
