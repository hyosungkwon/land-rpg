<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>land-rpg v4.3 · 테스트 세이브 시드 (부동산 서브 탭 · 전투 연출)</title>
<style>
  body { margin: 0; background: #070a12; color: #c9d4e6; font: 14px/1.6 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .note { color: #7f8ba1; font-size: 12px; margin-bottom: 12px; }
  a, button { display: block; padding: 10px 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #2b3a55;
    background: #16233a; color: #dce6f7; font: 600 13px system-ui, sans-serif; text-decoration: none; }
  code { color: #7fd3ff; }
  .warn { color: #ffb86b; font-size: 12px; }
</style>
</head>
<body>
<!-- 개발/검증용(v4.3): 부동산 서브 탭 3개와 전투 연출(보스 등장·부활 가호)을 바로 확인하도록
     테스트 세이브를 심고 390×844 미리보기를 연다. ?scene=land-home|land-market|land-buff|boss|grace
     기존 세이브는 __backup_v43 키에 한 번 보관한다. -->
<h1>v4.3 테스트 세이브 시드</h1>
<p class="note">저장 키 <code>land_rpg_unified_v3</code> 에 상태를 넣고 <code>mobile-frame.html</code> 을 엽니다.
기존 값은 <code>land_rpg_unified_v3__backup_v43</code> 에 한 번 백업됩니다.</p>
<p class="warn">검증용 페이지입니다. 실제 플레이 세이브가 있는 기기에서는 누르지 마세요.</p>
<div id="list"></div>
<script type="module">
  import { defaultState } from '../src/state.js';
  import { CITIES } from '../src/land.js';

  const KEY = 'land_rpg_unified_v3';
  const BACKUP = KEY + '__backup_v43';

  function seed(opts = {}) {
    const now = Date.now();
    const s = defaultState(now);
    const stage = opts.stage || 12;
    s.stage = stage;
    s.maxStage = stage;
    s.peakStage = stage;
    s.level = opts.level || 20;
    s.gold = opts.gold ?? 480000;
    s.shards = opts.shards ?? 1200;
    s.totalKills = stage * 12;
    s.bossKills = Math.max(0, stage - 2);
    s.soundOn = false; // 검증 화면에서는 소리 끔
    s.effects = true;
    s.screenShake = true;
    s.autoBoss = opts.autoBoss !== false;
    s.jobTier = 1;
    const eq = opts.equip ?? 22;
    s.equip = { weapon: eq, armor: eq, helmet: eq, ring: eq, amulet: eq };
    s.gearRarity = { weapon: 'rare', armor: 'rare', helmet: 'rare', ring: 'hero', amulet: 'rare' };
    // 🐾 펫 — 부동산 조건 해금 + 진화 가능 상태(버프·세트·펫 탭 확인용)
    s.pet = opts.pet || {
      equipped: 'wolf',
      unlocked: ['wolf', 'fox', 'owl', 'dragon'],
      chosen: true,
      levels: { wolf: 10, fox: 5, owl: 3, dragon: 2 },
      evo: { owl: 1 },
    };
    s.tower = { cleared: [1, 2, 3], best: 3, runs: 4, fails: 1, last: null };
    s.dungeon = { best: 0, runs: 0, last: null };
    s.rebirth = { count: 1, points: 8, totalPoints: 16, traits: { atk: 3, guard: 3, hp: 2 }, bestStage: 20, at: 0 };
    s.records.playMs = 5400 * 1000;
    // 🏢 부동산 — 12곳 보유(6곳 접기 확인) + 쌓인 임대수익 + 랜드마크
    s.land.owned = {};
    const cs = CITIES.filter((c) => c.base <= 9000).slice(0, 12);
    cs.forEach((c, i) => { s.land.owned[c.key] = 8 + i * 3; });
    s.land.owned[cs[0].key] = 40;
    s.land.landmarks = { [cs[0].key]: 2, [cs[1].key]: 1 };
    s.land.landmarkSpend = 92000;
    s.land.accruedRent = opts.rent ?? 184320;
    s.land.tradeCount = 21;
    s.land.taxPaid = 3480;
    s.land.totalRentClaimed = 2450000;
    s.land.bestAsset = 5200000;
    s.land.sub = opts.sub || 'home';
    s.land.rentAt = now - 600000;
    s.lastActiveAt = now; // 오프라인 팝업 방지
    if (opts.bossReady) {
      s.bossReady = true;
      s.killsInStage = 10; // 보스 도전 가능
      s.autoBoss = false;  // 배너를 잡을 수 있게 수동
    }
    return s;
  }

  const SCENES = {
    'land-home': { tab: 'land', sub: 'home' },
    'land-market': { tab: 'land', sub: 'market' },
    'land-buff': { tab: 'land', sub: 'buff' },
    boss: { tab: 'hunt', sub: 'skill', bossReady: true },
    grace: { tab: 'hunt', sub: 'skill', weak: true },
  };

  function put(scene) {
    const sc = SCENES[scene] || SCENES['land-home'];
    const opts = { sub: sc.sub };
    if (sc.bossReady) Object.assign(opts, { bossReady: true, stage: 10, level: 22, autoBoss: false });
    if (sc.weak) Object.assign(opts, { stage: 26, level: 6, equip: 0, gold: 1200, shards: 30, autoBoss: false });
    const s = seed(opts);
    try {
      const cur = localStorage.getItem(KEY);
      if (cur && !localStorage.getItem(BACKUP)) localStorage.setItem(BACKUP, cur);
    } catch (e) { /* ignore */ }
    localStorage.setItem(KEY, JSON.stringify(s));
    location.replace(`mobile-frame.html?tab=${sc.tab}&sub=${sc.sub}`);
  }

  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || '';
  if (SCENES[scene]) put(scene);

  const list = document.getElementById('list');
  const presets = [
    ['🏠 내 부동산·수령 (요약 바 · 보유 매물)', 'land-home'],
    ['🛒 매물 투자 (229개 검색·필터)', 'land-market'],
    ['⚡ 버프·세트·펫 (펫 진화)', 'land-buff'],
    ['👑 보스 등장 배너 (보스 버튼을 누르세요)', 'boss'],
    ['🛡 부활 가호 (약한 빌드 — 금방 쓰러집니다)', 'grace'],
  ];
  for (const [label, key] of presets) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => put(key);
    list.appendChild(b);
  }
  const back = document.createElement('a');
  back.textContent = '↩️ 백업한 세이브로 복구';
  back.href = '#';
  back.onclick = (e) => {
    e.preventDefault();
    try {
      const v = localStorage.getItem(BACKUP);
      if (v) localStorage.setItem(KEY, v);
    } catch (err) { /* ignore */ }
    location.replace('mobile-frame.html?tab=hunt');
  };
  list.appendChild(back);
</script>
</body>
</html>
