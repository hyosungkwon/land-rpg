<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>land-rpg v4.4 · 검증 하니스 (S31+ · 강화석 대량 교환 · 상위 전직)</title>
<style>
  html, body { margin: 0; background: #05070c; color: #a9b4c7; font: 12px/1.5 system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  .bar { width: 390px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7f8ba1; }
  .bar b { color: #cfe3ff; font-weight: 700; }
  .bar button { margin-left: auto; padding: 4px 8px; border-radius: 8px; border: 1px solid #2b3a55; background: #16233a; color: #dce6f7; font: 700 11px system-ui; }
  .phone { width: 390px; height: 844px; border-radius: 26px; overflow: hidden; box-shadow: 0 0 0 8px #1a2233, 0 18px 50px rgba(0,0,0,.6); background: #070a12; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  pre { width: 390px; margin: 0; font-size: 10px; color: #6f7d94; white-space: pre-wrap; word-break: break-all; }
  .warn { color: #ffb86b; font-size: 11px; width: 390px; }
</style>
</head>
<body>
<!-- 개발/검증용(v4.4): 테스트 세이브를 심고 index.html 을 390×844 iframe 에 띄우면서
     로드 중 발생하는 오류·리소스 실패를 수집해 아래에 보고한다.
       ?scene=xchg     장비 탭 — 강화석 ×1·×10·×100·최대 교환 카드
       ?scene=promote  전직·환생 탭 — 드래곤 로드(5단계) 전직 가능 카드
       ?scene=aura     사냥 탭 — 상위 전직 오라(🐉 진홍 빛기둥·불티·후광)
       ?scene=aura3    사냥 탭 — 비교용 4단계(🐲 드래곤 나이트) 오라
       ?restore=1      시드 전에 백업해 둔 실제 세이브로 되돌린다
     기존 세이브는 land_rpg_unified_v3__backup_v44 에 한 번만 보관한다. -->
<div class="wrap">
  <div class="bar"><b id="sceneName">v4.4 하니스</b><span id="status">준비 중…</span><button id="restoreBtn" type="button">세이브 복구</button></div>
  <p class="warn">검증용 페이지입니다. 실제 플레이 세이브가 있는 기기에서는 시드를 누르지 마세요(백업 후 복구 가능).</p>
  <div class="phone"><iframe id="fr" title="land-rpg 390×844"></iframe></div>
  <pre id="rep"></pre>
</div>
<script type="module">
  import { defaultState } from '../src/state.js';
  import { CITIES } from '../src/land.js';

  const KEY = 'land_rpg_unified_v3';
  const BACKUP = KEY + '__backup_v44';
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || 'xchg';
  document.getElementById('sceneName').textContent = `v4.4 · ${scene}`;

  const restoreBtn = document.getElementById('restoreBtn');
  restoreBtn.onclick = () => {
    const v = localStorage.getItem(BACKUP);
    if (v) localStorage.setItem(KEY, v);
    location.replace(location.pathname + '?scene=' + scene);
  };
  if (q.get('restore') === '1') {
    const v = localStorage.getItem(BACKUP);
    if (v) localStorage.setItem(KEY, v);
  }

  const SCENES = {
    xchg: { tab: 'gear', stage: 34, level: 65, jobTier: 4, gold: 2600000, shards: 220 },
    promote: { tab: 'hunt', sub: 'growth', stage: 33, level: 65, jobTier: 3, gold: 1800000, shards: 900 },
    aura: { tab: 'hunt', sub: 'skill', stage: 34, level: 68, jobTier: 4, gold: 2400000, shards: 640 },
    aura3: { tab: 'hunt', sub: 'skill', stage: 34, level: 68, jobTier: 3, gold: 2400000, shards: 640 },
  };

  function seed(opts) {
    const now = Date.now();
    const s = defaultState(now);
    s.stage = opts.stage; s.maxStage = opts.stage; s.peakStage = opts.stage;
    s.level = opts.level;
    s.gold = opts.gold; s.shards = opts.shards;
    s.jobTier = opts.jobTier;
    s.jobAt = now - 3600 * 1000;
    s.totalKills = opts.stage * 14; s.bossKills = Math.max(0, opts.stage - 2);
    s.killsInStage = 4;
    s.soundOn = false; s.effects = true; s.screenShake = true; s.autoBoss = true;
    s.equip = { weapon: 46, armor: 36, helmet: 32, ring: 24, amulet: 24 };
    s.gearRarity = { weapon: 'legend', armor: 'hero', helmet: 'hero', ring: 'rare', amulet: 'rare' };
    s.skills.strike.lv = 6; s.skills.whirl.lv = 4; s.skills.berserk.lv = 3; s.skills.heal.lv = 4;
    s.pet = {
      equipped: 'dragon', unlocked: ['wolf', 'fox', 'owl', 'dragon'], chosen: true,
      levels: { wolf: 10, fox: 9, owl: 7, dragon: 8 }, evo: { wolf: 2, fox: 2, owl: 1, dragon: 1 },
    };
    s.rebirth = { count: 3, points: 0, totalPoints: 210, traits: { atk: 9, hp: 7, gold: 4, critDmg: 4 }, bestStage: opts.stage - 2, at: 0 };
    s.records.playMs = 9 * 3600 * 1000;
    s.tower = { cleared: [1, 2, 3, 4], best: 4, runs: 6, fails: 2, last: null };
    s.land.owned = {};
    CITIES.filter((c) => c.base <= 9000).slice(0, 10).forEach((c, i) => { s.land.owned[c.key] = 10 + i * 4; });
    s.land.landmarkSpend = 64000;
    s.land.accruedRent = 51200;
    s.land.rentAt = now - 300000;
    s.land.sub = 'home';
    s.lastActiveAt = now; // 오프라인 팝업 방지
    return s;
  }

  const sc = SCENES[scene] || SCENES.xchg;
  // 앱은 부팅할 때 location.search 의 tab/sub 를 읽는다 → iframe URL 에 그대로 실어 준다
  if (!q.get('tab')) {
    const u = new URL(location.href);
    u.searchParams.set('tab', sc.tab);
    if (sc.sub) u.searchParams.set('sub', sc.sub);
    location.replace(u.toString());
  }
  const s = seed(sc);
  try {
    const cur = localStorage.getItem(KEY);
    if (cur && !localStorage.getItem(BACKUP)) localStorage.setItem(BACKUP, cur);
  } catch (e) { /* ignore */ }
  localStorage.setItem(KEY, JSON.stringify(s));

  // ── 앱을 390×844 iframe 에 띄우면서 로드 처음부터 오류를 수집한다 ──
  const RECORDER = '<script>window.__errs=[];' +
    'addEventListener("error",function(e){try{if(e.target&&e.target.tagName){window.__errs.push("res:"+(e.target.src||e.target.href||e.target.tagName));}else{window.__errs.push("err:"+(e.message||String(e.error)));}}catch(x){}},true);' +
    'addEventListener("unhandledrejection",function(e){window.__errs.push("reject:"+String(e.reason&&e.reason.message||e.reason));});' +
    '<\/script>';

  const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  const doc = html.replace('<head>', '<head><base href="../">' + RECORDER);
  const fr = document.getElementById('fr');
  const d = fr.contentDocument || fr.contentWindow.document;
  d.open(); d.write(doc); d.close();

  setTimeout(() => {
    try {
      const w = fr.contentWindow;
      const wd = w.document;
      const text = wd.body ? wd.body.innerText : '';
      const r = {
        scene,
        errs: w.__errs || [],
        tab: (w.location.search || '').slice(0, 60),
        cards: wd.querySelectorAll('.card').length,
        has100: text.includes('×100'),
        hasMax: text.includes('최대'),
        hasUpperJob: text.includes('상위 전직'),
        hasPromoteBtn: !!wd.querySelector('[data-action="promote"]'),
        title: wd.querySelector('.card-title') ? wd.querySelector('.card-title').innerText.slice(0, 40) : '',
        cache: null,
      };
      caches && caches.keys ? caches.keys().then((k) => {
        r.cache = k.filter((x) => x.indexOf('land-rpg') === 0);
        document.getElementById('rep').textContent = JSON.stringify(r, null, 1);
        window.__report = r;
        document.getElementById('status').textContent = (r.errs.length ? '오류 ' + r.errs.length + '건' : '오류 0건');
      }) : null;
      document.getElementById('rep').textContent = JSON.stringify(r, null, 1);
      window.__report = r;
      document.getElementById('status').textContent = (r.errs.length ? '오류 ' + r.errs.length + '건' : '오류 0건');
    } catch (e) {
      document.getElementById('status').textContent = '보고 실패: ' + e.message;
    }
  }, 3200);
</script>
</body>
</html>
