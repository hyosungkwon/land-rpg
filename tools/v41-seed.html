<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>land-rpg v4.1 · 테스트 세이브 시드</title>
<style>
  body { margin: 0; background: #070a12; color: #c9d4e6; font: 14px/1.6 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .note { color: #7f8ba1; font-size: 12px; margin-bottom: 12px; }
  a, button { display: block; padding: 10px 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #2b3a55;
    background: #16233a; color: #dce6f7; font: 600 13px system-ui, sans-serif; text-decoration: none; }
  code { color: #7fd3ff; }
  .warn { color: #ffb86b; font-size: 12px; }
</style>
</head>
<body>
<!-- 개발/검증용(v4.1): 테마 배경·환생 점프 화면을 바로 확인하도록 테스트 세이브를 심고 390×844 미리보기를 연다.
     ?stage=30 / ?stage=34&rebirth=1 처럼 지정할 수 있고, 기존 세이브는 __backup 키에 한 번 보관한다. -->
<h1>v4.1 테스트 세이브 시드</h1>
<p class="note">저장 키 <code>land_rpg_unified_v3</code> 에 상태를 넣고 <code>mobile-frame.html?tab=hunt</code> 를 엽니다.
기존 값은 <code>land_rpg_unified_v3__backup_v41</code> 에 한 번 백업됩니다.</p>
<p class="warn">검증용 페이지입니다. 실제 플레이 세이브가 있는 기기에서는 누르지 마세요.</p>
<div id="list"></div>
<script type="module">
  import { defaultState } from '../src/state.js';
  import { stageDef } from '../src/data.js';

  const KEY = 'land_rpg_unified_v3';
  const BACKUP = KEY + '__backup_v41';

  function seed(opts) {
    const now = Date.now();
    const s = defaultState(now);
    const stage = Math.max(1, opts.stage || 1);
    s.stage = stage;
    s.maxStage = stage;
    s.peakStage = stage;
    s.level = opts.level || Math.max(1, Math.round(stage * 1.3));
    s.gold = opts.gold ?? 480000;
    s.shards = opts.shards ?? 3600;
    s.totalKills = stage * 12;
    s.bossKills = stage;
    s.soundOn = false;
    s.jobTier = opts.job ?? Math.min(3, Math.floor(stage / 10));
    // 배경 확인용 시드는 죽지 않도록 장비 등급·강화를 적당히 준다(v4는 등급이 장비 종류로 마이그레이션된다)
    const eq = opts.equip ?? Math.min(80, 20 + stage * 2);
    s.equip = { weapon: eq, armor: eq, helmet: eq, ring: eq, amulet: eq };
    const rar = opts.rarity ?? 'legend';
    s.gearRarity = { weapon: rar, armor: rar, helmet: rar, ring: rar, amulet: rar };
    s.rebirth = {
      count: opts.rebirthCount || 0,
      points: opts.points ?? 0,
      totalPoints: opts.points ?? 0,
      traits: opts.traits || { atk: 6, hp: 6, guard: 5 },
      bestStage: opts.bestStage || 1,
      at: 0,
    };
    s.records.playMs = 3600 * 1000 + stage * 60000;
    s.lastActiveAt = now; // 오프라인 보상 팝업이 뜨지 않게 방금 접속한 것으로 둔다
    return s;
  }

  function put(opts) {
    try {
      const cur = localStorage.getItem(KEY);
      if (cur && !localStorage.getItem(BACKUP)) localStorage.setItem(BACKUP, cur);
    } catch (e) { /* ignore */ }
    localStorage.setItem(KEY, JSON.stringify(seed(opts)));
    location.replace('mobile-frame.html?tab=hunt' + (opts.sub ? '&sub=' + opts.sub : ''));
  }

  const presets = [
    { label: 'S34 (환생 가능)', opts: { stage: 34, level: 44, sub: 'growth' } },
    { label: 'S30', opts: { stage: 30, level: 40 } },
    { label: 'S31', opts: { stage: 31, level: 42 } },
    { label: 'S32', opts: { stage: 32, level: 43 } },
    { label: 'S29', opts: { stage: 29, level: 38 } },
    { label: 'S27', opts: { stage: 27, level: 36 } },
    { label: 'S12', opts: { stage: 12, level: 18 } },
    { label: 'S4', opts: { stage: 4, level: 6 } },
  ];

  const q = new URLSearchParams(location.search);
  const qs = Number(q.get('stage'));
  if (qs > 0) {
    put({ stage: qs, rebirth: Number(q.get('rebirth')) === 1, sub: q.get('sub') || '' });
  }

  const list = document.getElementById('list');
  for (const p of presets) {
    const b = document.createElement('button');
    b.textContent = p.label + ' · ' + stageDef(p.opts.stage).theme.name + (p.opts.sub ? ' (전직·환생 탭)' : '');
    b.onclick = () => put(p.opts);
    list.appendChild(b);
  }
  const back = document.createElement('a');
  back.textContent = '↩️ 백업한 세이브로 복구';
  back.href = '#';
  back.onclick = (e) => {
    e.preventDefault();
    try {
      const v = localStorage.getItem(BACKUP);
      if (v) localStorage.setItem(KEY, v);
    } catch (err) { /* ignore */ }
    location.replace('mobile-frame.html?tab=hunt');
  };
  list.appendChild(back);
</script>
</body>
</html>
